[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagomatech-barchart"
version = "0.2.0"
description = "Barchart historical futures data and agricultural contract utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "requests>=2.28",
    "urllib3>=1.26",
]

[project.optional-dependencies]
demo = [
    "matplotlib>=3.7",
    "jupyterlab>=4.0",
    "screamer>=1.2,<2",
]

[tool.setuptools]
packages = ["Barchart"]
package-dir = {Barchart = "."}
