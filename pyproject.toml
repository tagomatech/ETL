[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "barchart-data"
version = "0.3.0"
description = "Modern Python client for Barchart market and financial data"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "tagomatech"}]
dependencies = [
    "pandas>=1.5",
    "requests>=2.28",
    "urllib3>=1.26",
]

[project.optional-dependencies]
demo = [
    "matplotlib>=3.7",
    "jupyterlab>=4.0",
    "screamer>=1.2,<2",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["barchart_data*", "Barchart*"]
exclude = ["Barchart.tests*"]
